apiVersion: apps/v1
kind: Deployment

metadata:
  name: results-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: results-service

  template:
    metadata:
      labels:
        app: results-service

    spec:
      containers:
      - name: results-service

        image: saugat0082/results-service:2.2

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:
        - name: ConnectionStrings__DefaultConnection
          value: Host=postgres-service;Port=5432;Database=cv_results_db;Username=user;Password=password

        - name: RabbitMQ__Host
          value: rabbitmq-service

        - name: RabbitMQ__Username
          value: guest

        - name: RabbitMQ__Password
          value: guest